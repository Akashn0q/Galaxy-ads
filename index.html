<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Cricket Hub</title>

<!-- META PIXEL CODE YAHAN PASTE KAREIN -->

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#080d19;
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.container{
width:100%;
max-width:420px;
background:linear-gradient(145deg,#17243b,#0b1221);
border:1px solid #263b5c;
border-radius:24px;
padding:35px 24px;
text-align:center;
box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.logo{
width:95px;
height:95px;
border-radius:50%;
border:3px solid #d5ad55;
margin:0 auto 18px;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
font-weight:bold;
color:#e9c778;
background:#111c30;
}

h1{
font-size:27px;
letter-spacing:1px;
margin-bottom:12px;
}

h1 span{
color:#e9c778;
}

.subtitle{
color:#b7c3d5;
font-size:14px;
line-height:1.7;
margin-bottom:25px;
}

.line{
height:1px;
background:#34445e;
margin:22px 0;
}

.info{
font-size:14px;
color:#d6dfed;
line-height:1.9;
margin-bottom:25px;
}

.join-btn{
display:block;
background:linear-gradient(135deg,#e9c778,#b98a35);
color:#101827;
text-decoration:none;
padding:15px;
border-radius:12px;
font-size:16px;
font-weight:bold;
letter-spacing:1px;
transition:.3s;
}

.join-btn:hover{
transform:scale(1.03);
}

.footer{
margin-top:25px;
font-size:11px;
color:#8290a5;
line-height:1.7;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">GC</div>

<h1>GALAXY <span>CRICKET HUB</span></h1>

<p class="subtitle">
Your Destination For Cricket Updates & Match Analysis
</p>

<div class="line"></div>

<div class="info">
Stay Connected With The Latest Cricket Updates,
Match Previews, Team News And Statistical Analysis.
</div>

<a class="join-btn"
href="YOUR_TELEGRAM_LINK"
target="_blank"
onclick="if(typeof fbq==='function'){fbq('track','Subscribe');}">
JOIN TELEGRAM CHANNEL →
</a>

<div class="footer">
© 2026 Galaxy Cricket Hub<br>
For informational and entertainment purposes only.
</div>

</div>

</body>
</html>
